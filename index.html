<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="script.js"></script>
</head>

<body>
    <header>
        <h1 class="header__title">Library</h1>
    </header>

    <main>
        <button class="button" id="add-book">New book</button>

        <dialog class="book-modal" id="book-modal">
            <form class="book-form" id="book-form">
                <label class="book-form__label" for="book-title">Title</label>
                <input class="book-form__input" type="text" name="bookTitle" id="book-title" required>

                <label class="book-form__label" for="book-author">Author</label>
                <input class="book-form__input" type="text" name="bookAuthor" id="book-author" required>

                <label class="book-form__label" for="book-publish-year">Year Published</label>
                <input class="book-form__input" type="text" name="bookPublishYear" id="book-publish-year" required>

                <label class="book-form__label" for="book-pages">Pages</label>
                <input class="book-form__input" type="text" name="bookPages" id="book-pages" required>

                <div>
                    <label class="book-form__label" for="book-read">Read</label>
                    <input class="book-form__input" type="checkbox" name="bookRead" id="book-read">
                </div>

                <div class="book-form__buttons">
                    <button class="button book-form__submit" type="submit">Add Book</button>
                    <button class="button book-modal__close" id="book-modal-close-btn">Cancel</button>
                </div>
            </form>
        </dialog>

        <section class="library" id="library">
            <!-- <div class="book card">
                <button class="button book__remove">X</button>
                <h2 class="book__title">Test</h2>
                <p class="book__author">Test</p>
                <p class="book__publish-year">1234</p>
                <p class="book__pages">984</p>
                <div>
                    <p class="book__read">Read</p>
                    <input class="book__read-checkbox" type="checkbox" disabled>
                </div>
                <button class="button book__update-read">Update Read Status</button>
            </div> -->
        </section>
    </main>
</body>

</html>
