<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="script.js"></script>
</head>

<body>
    <header>
        <h1 class="header__title">Library</h1>
    </header>

    <main>
        <button class="button" commandfor="book-modal" command="show-modal">New book</button>

        <dialog class="book-modal" id="book-modal">
            <button class="button book-modal__close" commandfor="book-modal" command="close">X</button>
            <h2 class="book-modal__title">Enter the book information</h2>

            <form class="book-form" id="book-form">
                <label class="book-form__label" for="book-title">Title</label>
                <input class="book-form__action" type="text" name="bookTitle" id="book-title">

                <label class="book-form__label" for="book-author">Author</label>
                <input class="book-form__action" type="text" name="bookAuthor" id="book-author">

                <label class="book-form__label" for="book-publish-year">Year Published</label>
                <input class="book-form__action" type="text" name="bookPublishYear" id="book-publish-year">

                <label class="book-form__label" for="book-pages">Pages</label>
                <input class="book-form__action" type="text" name="bookPages" id="book-pages">

                <label class="book-form__label" for="book-read">Read</label>
                <input class="book-form__action" type="checkbox" name="bookRead" id="book-read">

                <button class="button book-form__submit" type="submit">Add Book</button>
            </form>
        </dialog>

        <section class="library" id="library">
            <!-- <div class="book card">
                <button class="button book__remove">X</button>
                <h2 class="book__title">Test</h2>
                <p class="book__author">Test</p>
                <p class="book__publish-year">1234</p>
                <p class="book__pages">984</p>
                <div>
                    <p class="book__read">Read</p>
                    <input class="book__read-checkbox" type="checkbox" disabled>
                </div>
                <button class="button book__update-read">Update Read Status</button>
            </div> -->
        </section>
    </main>
</body>

</html>
