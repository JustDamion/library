<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="script.js"></script>
</head>

<body>
    <header class="header">
        <div class="header__branding">
            <img class="header__logo" src="images/logo.webp" alt="" width="160" height="160">
            <h1 class="header__title">My Library</h1>
            <div class="card header__stats">
                <p>Books read: <span id="stats-finished">0</span></p>
                <p>Books to be read: <span id="stats-unfinished">0</span></p>
                <p>Total books in library: <span id="stats-total">0</span></p>
            </div>
        </div>

        <div class="header__settings">
            <img class="header__edit" src="images/edit.svg" alt="Edit library">
            <img class="header__avatar" src="images/avatar.svg" alt="Account picture">
        </div>
    </header>

    <main>
        <div class="data-controls">
            <button class="button data__sort">Sort By</button>
            <button class="button data__filter">Filter</button>
        </div>

        <dialog class="book-modal" id="book-modal">
            <button class="button book-modal__close" id="book-modal-close-btn">X</button>
            <h2 class="book-modal__title">New Book</h2>

            <form class="book-form" id="book-form">
                <div class="book-form__entry">
                    <label class="book-form__label" for="book-title">Title:</label>
                    <input class="book-form__input" type="text" name="bookTitle" id="book-title" required>
                </div>

                <div class="book-form__entry">
                    <label class="book-form__label" for="book-author">Author:</label>
                    <input class="book-form__input" type="text" name="bookAuthor" id="book-author" required>
                </div>

                <div class="book-form__entry">
                    <label class="book-form__label" for="book-pages">Pages:</label>
                    <input class="book-form__input" type="text" name="bookPages" id="book-pages" required>
                </div>

                <div class="book-form__entry">
                    <label class="book-form__label" for="book-genre">Genre:</label>
                    <input class="book-form__input" type="text" name="bookGenre" id="book-genre">
                </div>

                <div class="book-form__entry">
                    <label class="book-form__label" for="book-rating">Rating:</label>
                    <input class="book-form__input" type="text" name="bookRating" id="book-rating">
                </div>

                <div class="book-form__entry">
                    <label class="book-form__label" for="book-date-finished">Date Finished:</label>
                    <input class="book-form__input" type="text" name="bookDateFinished" id="book-date-finished">
                </div>

                <fieldset class="book-form__status">
                    <div>
                        <input class="book-form__input" type="radio" name="bookStage" id="book-dnf" value="dnf">
                        <label class="book-form__label" for="book-dnf">DNF</label>
                    </div>

                    <div>
                        <input class="book-form__input" type="radio" name="bookStage" id="book-tbr" value="tbr">
                        <label class="book-form__label" for="book-tbr">TBR</label>
                    </div>

                    <div>
                        <input class="book-form__input" type="radio" name="bookStage" id="book-in-progress"
                            value="inProgress">
                        <label class="book-form__label" for="book-in-progress">In progress</label>
                    </div>

                    <div>
                        <input class="book-form__input" type="radio" name="bookStage" id="book-finished"
                            value="finished" checked>
                        <label class="book-form__label" for="book-finished">Finished</label>
                    </div>
                </fieldset>

                <button class="button book-form__submit" type="submit">Add Book +</button>
            </form>
        </dialog>

        <section class="library" id="library">
            <div class="book card new-book__card">
                <button class="button new-book__action" id="add-book">New Book +</button>
            </div>
        </section>
    </main>
</body>

</html>
